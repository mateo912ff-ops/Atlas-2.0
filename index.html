<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<title>ATLAS IA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef0f2;--surface:#ffffff;--text:#0a0a0b;--muted:#5b6068;--accent:#0a0a0b;--accent-bg:linear-gradient(135deg,#2c2d30,#000);--on-accent:#ffffff;--bot:#dfe2e6;--border:#c8ccd2;--silver:#c0c4ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--surface:#0b0b0c;--text:#f4f4f5;--muted:#9a9ea6;--accent:#c7cad0;--accent-bg:linear-gradient(135deg,#eceef1,#a3a8b0);--on-accent:#000000;--bot:#19191b;--border:#2a2c30;--silver:#c0c4ca;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:18px;margin:0}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m img{display:block;max-width:100%;border-radius:12px;margin-top:8px}
.m canvas.dib{display:block;width:100%;max-width:420px;height:auto;border-radius:12px;margin-top:8px;cursor:pointer}
.m .img-cap{font-size:13px;color:var(--muted);margin-top:4px}
.m.gen{opacity:.85}
.m .onl img{display:block;width:100%;max-width:420px;height:auto;border-radius:12px;margin-top:8px;cursor:pointer}
.u{align-self:flex-end;background:var(--accent-bg);color:var(--on-accent);border-bottom-right-radius:6px}
.b{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border)}
#chips button{flex:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px}
#stat{display:flex;justify-content:space-between;gap:8px;padding:4px 14px;font-size:12px;color:var(--muted);background:var(--surface)}
#stat a{color:var(--muted);text-decoration:underline;margin-left:10px}
#bar{display:flex;gap:8px;padding:10px 12px;background:var(--surface)}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--text);max-height:120px}
#send{border:0;background:var(--accent-bg);color:var(--on-accent);border-radius:50%;width:44px;height:44px;font-size:18px}

header{display:flex;align-items:center;gap:10px}
header>div{flex:1;min-width:0}
header p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:18px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84%,330px);background:var(--surface);border-right:1px solid var(--border);z-index:21;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.dopen #drawer{transform:none}body.dopen #ov{display:block}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--border)}
.dh button{background:var(--accent-bg);color:var(--on-accent);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
#list{flex:1;overflow-y:auto;padding:8px}
.it{display:flex;align-items:center;gap:4px;border-radius:10px;padding:2px}
.it.on{background:var(--bot)}
.it .t{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:10px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .x{background:none;border:0;font-size:16px;padding:8px;color:var(--muted)}
h1 .lg{height:26px;width:26px;border-radius:6px;vertical-align:-6px;margin-right:8px}
#theme{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:16px}
.typing{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px;padding:12px 16px;display:flex;gap:5px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);gap:8px}
#empty .bot{font-size:48px;line-height:1}
#empty b{color:var(--text);font-size:17px}
#chips button:active{transform:scale(.96)}
#send:active{transform:scale(.92)}
.m.b a{color:var(--text);text-decoration:underline}
#ver{font-size:11px;color:var(--muted);text-align:center;padding:4px;opacity:.7;cursor:pointer}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.m,.m *,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.m canvas,.m img{-webkit-user-select:none;user-select:none}
header img,.lg{-webkit-user-drag:none;pointer-events:none}
body.light{--bg:#eef0f2;--surface:#ffffff;--text:#0a0a0b;--muted:#5b6068;--accent:#0a0a0b;--accent-bg:linear-gradient(135deg,#2c2d30,#000);--on-accent:#ffffff;--bot:#dfe2e6;--border:#c8ccd2;--silver:#c0c4ca;color-scheme:light}
body.dark{--bg:#000000;--surface:#0b0b0c;--text:#f4f4f5;--muted:#9a9ea6;--accent:#c7cad0;--accent-bg:linear-gradient(135deg,#eceef1,#a3a8b0);--on-accent:#000000;--bot:#19191b;--border:#2a2c30;--silver:#c0c4ca;color-scheme:dark}

header{border-bottom:1px solid var(--silver)}
h1 .lg{box-shadow:0 0 0 1px var(--silver)}
#stat{flex-wrap:wrap;align-items:center}
#stat .lnks{display:flex;flex-wrap:wrap;gap:2px 0;justify-content:flex-end}
#stat #copyl{color:var(--text);font-weight:600}
#chips button:hover{border-color:var(--silver)}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--accent-bg);color:var(--on-accent);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header><button id="menu" aria-label="Chats">☰</button><div><h1><img src="logo.png" alt="" class="lg">ATLAS IA</h1><p id="ctitle"></p></div><button id="theme" aria-label="Tema" title="Cambiar tema">🌓</button><button id="newb" aria-label="Chat nuevo">＋</button></header>
  <div id="ov"></div>
  <aside id="drawer"><div class="dh"><b>Tus chats</b><button id="newc">＋ Nuevo chat</button></div><div id="list"></div></aside>
  <div id="msgs"></div>
  <div id="chips"></div>
  <div id="stat"><span id="count"></span><span class="lnks"><a href="#" id="copyl">📋 Copiar lo aprendido</a><a href="#" id="respl">💾 Respaldo</a><a href="#" id="restl">📥 Restaurar</a><a href="#" id="instl" style="display:none">📲 Instalar app</a><a href="#" id="verl">ℹ️ Versión</a><a href="#" id="clr">Limpiar conversación</a><a href="#" id="forget">Olvidar lo aprendido</a></span></div>
  <div id="bar">
    <textarea id="inp" rows="1" placeholder="Escribe un mensaje…"></textarea>
    <button id="send" type="button" aria-label="Enviar">➤</button>
  </div>
  <div id="ver" title="Ver versión">ATLAS IA · v6.0 · local & offline</div>
</div>

function limpiar(s){
  s=String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[^\p{L}\p{N} +\-*\/^().,%¿?!:_|'×÷]/gu,' ');

}

function evalExpr(src){
  const toks=[]; const re=/\s*(\d+(?:\.\d+)?|\.\d+|\*\*|\/\/|[-+*\/%()])/y; let p=0; src=src.trim();
  while(p<src.length){ re.lastIndex=p; const m=re.exec(src); if(!m) throw 0; toks.push(m[1]); p=re.lastIndex; }
  if(toks.length<3) throw 0;
  let i=0; const peek=()=>toks[i], next=()=>toks[i++];
  const chk=v=>{ if(!isFinite(v)||Math.abs(v)>1e100) throw 0; return v; };
  function atom(){ const t=next(); if(t===undefined) throw 0; if(t==='('){ const v=expr(); if(next()!==')') throw 0; return v; } const n=parseFloat(t); if(isNaN(n)) throw 0; return n; }
  function power(){ const a=atom(); if(peek()==='**'){ next(); const b=unary(); if(Math.abs(b)>10) throw 0; return chk(Math.pow(a,b)); } return a; }
  function unary(){ if(peek()==='-'){ next(); return -unary(); } if(peek()==='+'){ next(); return unary(); } return power(); }
  function term(){ let a=unary(); while(['*','/','//','%'].includes(peek())){ const o=next(); const b=unary(); if(o!=='*'&&b===0) throw 0; a=chk(o==='*'?a*b:o==='/'?a/b:o==='//'?Math.floor(a/b):((a%b)+b)%b); } return a; }
  function expr(){ let a=term(); while(peek()==='+'||peek()==='-'){ const o=next(); const b=term(); a=chk(o==='+'?a+b:a-b); } return a; }
  const r=expr(); if(i!==toks.length) throw 0; return r;
}

function ingles(raw){

  else if((m=t.match(/^(?:como se dice|traduce(?:me)?|traducir)\s+(.+?)\s+(?:en|al) espanol$/))){ dir='es'; w=m[1]; fuerte=true; }
  else if((m=t.match(/^(?:que significa|que quiere decir|significado de|que quiere decir la palabra|que significa la palabra)\s+(.+)$/))){ dir='es'; w=m[1].replace(/\s+en espanol$/,''); }

function lev(a,b){ const m=a.length,n=b.length; let pr=Array.from({length:n+1},(_,j)=>j);

  if(saber[t]) return t;

  for(const k in saber) if(k.length>=4&&t.includes(k)&&(!best||k.length>best.length)) best=k;
  if(best) return best;
  const w=new Set(t.split(' ').filter(x=>!STOP.has(x))); let bk=null,bs=0;
  for(const k in saber){ const kc=[...new Set(k.split(' ').filter(x=>!STOP.has(x)&&x.length>1))];
    if(!kc.length||k.length<4) continue;
    if(kc.every(x=>w.has(x))){ const s=kc.length*1000+k.length; if(s>bs){bs=s;bk=k;} } }
  if(bk) return bk;
  const tc=[...w].join(' '); if(tc.length<4) return null;

function sha256(s){
  const K=[],H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];
  let p=2,n=0; while(n<64){ let ok=true; for(let i=2;i*i<=p;i++) if(p%i===0){ ok=false; break; } if(ok){ K[n++]=(Math.pow(p,1/3)%1)*4294967296|0; } p++; }
  const b=Array.from(new TextEncoder().encode(s)), l=b.length*8; b.push(128); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){
    const w=[]; for(let i=0;i<16;i++) w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
    for(let i=16;i<64;i++){ const a=w[i-15],c=w[i-2]; w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))|0; }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0; }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

function extractImagePrompt(raw){
  const t = raw.trim();
  const lower = t.toLowerCase();
  // Patrones comunes en español
  const patterns = [
    /^(?:crea|creá|genera|generá|dibuja|dibujá|haz|hacé|make|draw|generate|create)\s+(?:una?\s+)?(?:imagen|foto|dibujo|ilustraci[oó]n|picture|image)?\s*(?:de|del|de la|of)?\s*(.+)$/i,
    /^(?:quiero|necesito|me gustar[ií]a)\s+(?:una?\s+)?(?:imagen|foto|dibujo)\s+(?:de|del|de la)\s+(.+)$/i,
    /^(?:imagen|foto|dibujo)\s+(?:de|del|de la)\s+(.+)$/i,
    /^\/img\s+(.+)$/i,
    /^\/imagen\s+(.+)$/i,
  ];
  for(const p of patterns){
    const m = t.match(p);
    if(m && m[1] && m[1].trim().length > 2) return m[1].trim();
  }
  // Si dice explícitamente "generar imagen" o similar al inicio
  if(/^(crea|creá|genera|generá|dibuja|dibujá).{0,20}(imagen|foto|dibujo)/i.test(lower)){
    const cleaned = t.replace(/^(crea|creá|genera|generá|dibuja|dibujá|haz|hacé)\s+/i,'').replace(/^(una?\s+)?(imagen|foto|dibujo|ilustraci[oó]n)\s*(de|del|de la)?\s*/i,'').trim();
    if(cleaned.length > 2) return cleaned;
  }
  return null;
}

// ===== Imágenes en línea (mejor calidad) con respaldo sin internet =====
let claveImg=''; try{ claveImg=localStorage.getItem('atlas_img_key')||''; }catch(e){}
let modoImg='offline'; try{ modoImg=localStorage.getItem('atlas_img_modo')||'offline'; }catch(e){}
function urlOnline(prompt,seed,conClave){
  const q='?model=flux&width=768&height=768&nologo=true&enhance=true&seed='+seed;
  const p=encodeURIComponent(prompt.slice(0,400));
  if(claveImg && conClave) return 'https://gen.pollinations.ai/image/'+p+q+'&key='+encodeURIComponent(claveImg);
  return 'https://image.pollinations.ai/prompt/'+p+q;
}
function pedirImagenOnline(prompt,seed){
  return new Promise((ok,fail)=>{
    const img=new Image(); let fin=false;
    const t=setTimeout(()=>{ if(!fin){ fin=true; img.src=''; fail(new Error('tiempo')); } },45000);
    img.onload=()=>{ if(fin) return; fin=true; clearTimeout(t); ok(img); };
    img.onerror=()=>{ if(fin) return; fin=true; clearTimeout(t); fail(new Error('error')); };
    img.src=urlOnline(prompt,seed,true);
  });
}
function cargarOnline(box,o){
  box.textContent='🎨 Cargando imagen…';
  pedirImagenOnline(o.p,o.s).then(img=>{
    box.textContent=''; img.alt=o.p; box.appendChild(img);
    img.onclick=async()=>{ try{ const r=await fetch(img.src); const b=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='atlas-ia-imagen.png'; document.body.appendChild(a); a.click(); a.remove(); toast('🖼️ Imagen guardada'); }catch(e){ window.open(img.src,'_blank'); } };
  }).catch(()=>{
    box.textContent='';
    const cv=document.createElement('canvas'); cv.className='dib'; box.appendChild(cv);
    try{ dibujar(cv,o.p,o.s); }catch(e){ cv.replaceWith(document.createTextNode('(No pude mostrar esta imagen)')); }
  });
}
function dibujarOffline(prompt){
  const seed=(Date.now()%1000000)+1;
  let ok=true; try{ ok=dibujar(document.createElement('canvas'),prompt,seed).conocido; }catch(e){ add('b','No pude dibujar eso 😕 Prueba con otra cosa.'); return; }
  if(ok) add('b','Listo ✨ (dibujado por ATLAS IA, sin internet)',null,'Toca el dibujo para guardarlo',{p:prompt,s:seed});
  else add('b','Eso no lo sé dibujar todavía, así que hice arte abstracto 🎨\nPrueba con: gato, perro, robot, casa, árbol, coche, pez, barco, flor, corazón, cohete, planeta, mariposa, pájaro, estrella, avión, conejo, tortuga, hongo, oso, manzana, helado, castillo, bicicleta, muñeco de nieve.\nY escenas: playa, montañas, ciudad, bosque, noche, atardecer, espacio.\nEj: «dibuja un gato astronauta en el espacio»',null,'Toca el dibujo para guardarlo',{p:prompt,s:seed});
}
function generarImagen(raw){
  const prompt = extractImagePrompt(raw);
  if(!prompt) return false;
  const corto=prompt.slice(0,80)+(prompt.length>80?'…':'');
  if(modoImg==='offline'||!navigator.onLine){
    add('b','🎨 Dibujando…\n«'+corto+'»');
    setTimeout(()=>dibujarOffline(prompt),500);
    return true;
  }
  const chatId=cur, seed=(Date.now()%1000000)+1;
  add('b','🎨 Creando imagen con IA en línea…\n«'+corto+'»');
  pedirImagenOnline(prompt,seed).then(()=>{
    const c=chats.find(x=>x.id===chatId); if(!c) return;
    const prev=cur; cur=chatId;
    add('b','Listo ✨ (imagen creada con IA en línea)',null,'Toca la imagen para guardarla',null,{p:prompt,s:seed});
    if(prev!==chatId && chats.find(x=>x.id===prev)) cur=prev;
    persist();
  }).catch(()=>{
    const c=chats.find(x=>x.id===chatId); if(!c) return;
    const prev=cur; cur=chatId;
    add('b','No pude conectar con el servicio de imágenes en línea 😕 (puede estar saturado o pedir clave: usa /clave). Te hago un dibujo sin internet:');
    dibujarOffline(prompt);
    if(prev!==chatId && chats.find(x=>x.id===prev)) cur=prev;
    persist();
  });
  return true;
}

function go(){
  const raw=inp.value.trim(); if(!raw) return;
  inp.value=''; inp.style.height='auto'; add('u',raw);
  const c=chat();
  if(c.pending==='__nombre__'&&!raw.startsWith('/')){ const n=sacarNombre(raw);
    if(n){ guardarNombre(n); c.pending=null; add('b','¡Mucho gusto, '+n+'! 😊 Desde ahora te saludaré así en cada chat nuevo. '+(esDueno()?'Escribe /ayuda para ver qué puedo hacer.':'Pregúntame lo que quieras.')); }
    else add('b','No te entendí 😅 Escribe solo tu nombre, por favor.');
    return; }
  if(c.pending&&c.pending!=='__nombre__'&&!raw.startsWith('/')){ const q=c.pending; c.pending=null;
    if(limpiar(raw)==='saltar'){ add('b','Ok, la dejamos así 👍'); return; }
    aprendido[q]=[raw]; saber[q]=[raw]; guardar(); add('b','¡Aprendido y guardado! ✅'); return; }
  if(c.pending!=='__nombre__') c.pending=null;
  { const gd=atlasGuard(raw); if(gd){ add('b',gd); return; } }
  if(comando(raw)) return;
  const r=calcular(raw); if(r){ add('b',r); return; }
  if(generarImagen(raw)) return;
  const t=limpiar(raw);
  if(!saber[t]){ const en=ingles(raw); if(en){ add('b',en); return; } }
  const k=buscar(t);
  if(k){ add('b',pick(saber[k])); return; }
  if(navigator.onLine&&preguntaWiki(raw)){ wikiResponder(raw,t); return; }
  sinRespuesta(t);
}
$('send').onclick=go;
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); go(); } });
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });

// ===== v5.9: respaldo de lo aprendido + búsqueda en Wikipedia (solo cuando hay internet) =====
function nAprendido(){ return Object.keys(aprendido).length; }
let _avisoResp=false;
function avisoResp(){ if(_avisoResp) return; let u=0; try{ u=parseInt(localStorage.getItem('atlas_resp_n')||'0',10)||0; }catch(e){}
  if(nAprendido()-u>=5){ _avisoResp=true; toast('💡 Tienes cosas nuevas sin respaldar. Toca 💾 Respaldo'); } }
function hacerRespaldo(){
  const n=nAprendido();
  const data=JSON.stringify({app:'atlas-ia',version:APP_VERSION,aprendido,nombre,fecha:new Date().toISOString()},null,2);
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='atlas-ia-respaldo.json'; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ toast('No pude crear el respaldo 😕'); return; }
  try{ localStorage.setItem('atlas_resp_n',String(n)); }catch(e){}
  _avisoResp=false; toast('💾 Respaldo guardado ('+n+(n===1?' cosa aprendida)':' cosas aprendidas)'));
}
function restaurarRespaldo(){
  const fi=document.createElement('input'); fi.type='file'; fi.accept='.json,application/json';
  fi.onchange=()=>{ const f=fi.files&&fi.files[0]; if(!f) return;
    if(f.size>5e6){ toast('Ese archivo es muy grande 😕'); return; }
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result); const ap=d&&d.aprendido;
      if(!ap||typeof ap!=='object'||Array.isArray(ap)) throw 0;
      let n=0;
      for(const k of Object.keys(ap).slice(0,5000)){
        const v=ap[k]; const arr=(Array.isArray(v)?v:[v]).filter(x=>typeof x==='string'&&x.length<=2000).slice(0,10);
        const kk=limpiar(k).slice(0,300); if(!arr.length||!kk) continue;
        aprendido[kk]=arr; saber[kk]=arr.slice(); n++; }
      if(typeof d.nombre==='string'&&d.nombre.trim()&&!nombre) guardarNombre(d.nombre.trim().slice(0,40));
      guardar(); try{ localStorage.setItem('atlas_resp_n',String(nAprendido())); }catch(e){}
      add('b','✅ Respaldo restaurado: '+n+(n===1?' cosa aprendida. 🧠':' cosas aprendidas. 🧠'));
    }catch(e){ add('b','Ese archivo no parece un respaldo de ATLAS IA 😕'); } };
    r.readAsText(f); };
  fi.click();
}

// ===== ATLAS GUARD (ligero): cuidar a las personas sin castigar =====
const G_ADULTO=/\b(porno\w*|pornografia|xxx|hentai|erotic\w*|desnud[oa]s?|nudes?|sexting)\b/;
const G_PELIGRO=/\b(como (hacer|fabricar|construir|armar) (una |un )?(bomba|explosivos?|arma casera|veneno)|bomba casera|fabricar (drogas?|metanfetamina)|hackear (cuentas?|a alguien)|robar (cuentas?|contrasenas?))\b/;
const G_APOYO=/\b(me quiero (matar|morir|cortar|hacer dano)|quiero (morir|morirme|suicidarme)|me voy a (matar|suicidar)|no quiero (seguir viviendo|vivir mas|estar vivo|estar viva)|quiero hacerme dano|me estoy cortando)\b/;
function atlasGuard(raw){
  if(raw.trim()[0]==='/') return '';
  const s=limpiar(raw);
  if(G_APOYO.test(s)) return 'Siento mucho que te sientas así 💙 No estás solo/a. Cuéntale hoy mismo a una persona de confianza (mamá, papá, un familiar, un profe o un amigo) cómo te sientes. Si estás en peligro o piensas hacerte daño ahora, llama al número de emergencias de tu país o pídele a un adulto que se quede contigo. Yo soy una app sencilla y no puedo reemplazar a una persona, pero si quieres, aquí sigo para hablar de otras cosas.';
  if(G_ADULTO.test(s)) return '🛡️ Eso no es algo con lo que pueda ayudar. Pregúntame otra cosa, por ejemplo ciencia, deportes, cálculos o un dibujo 🙂';
  if(G_PELIGRO.test(s)) return '🛡️ Eso podría ser peligroso, así que no te puedo ayudar con eso. Si tienes curiosidad, pregúntame de forma segura, por ejemplo «qué es la química» 🙂';
  return '';
}
let ultimaWiki=null;
function preguntaWiki(raw){ const s=raw.trim(); if(s.length<4||s.length>90||s[0]==='/') return false;
  return /^[¿]|\?\s*$/.test(s)||/^(qu[eé]|qui[eé]n|qui[eé]nes|cu[aá]l|cu[aá]les|cu[aá]ndo|d[oó]nde|c[oó]mo|cu[aá]nt[oa]s?)\s/i.test(s); }
function consultaWiki(raw){
  return raw.toLowerCase().replace(/[¿?¡!.,;:]/g,' ')
    .replace(/^\s*(qu[eé]|qui[eé]n|qui[eé]nes|cu[aá]l|cu[aá]les|cu[aá]ndo|d[oó]nde|c[oó]mo|cu[aá]nt[oa]s?)\s+(es|son|fue|fueron|era|eran|est[aá]|est[aá]n|significa|significan|se llama|se llaman)?\s*/,'')
    .replace(/^(un|una|el|la|los|las|de|del|de la)\s+/,'').replace(/\s+/g,' ').trim().slice(0,100);
}
async function buscarWiki(raw){
  const q=consultaWiki(raw); if(q.length<3) return null;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  try{
    const u='https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(q)+'&prop=extracts&exintro=1&explaintext=1&exsentences=3&redirects=1';
    const r=await fetch(u,{signal:ctl.signal}); if(!r.ok) return null;
    const d=await r.json(); const pg=d&&d.query&&d.query.pages; if(!pg) return null;
    const p=Object.values(pg)[0]; const ex=String((p&&p.extract)||'').trim();
    if(ex.length<30||/pued(e|en) referirse a/i.test(ex.slice(0,250))||G_ADULTO.test(limpiar(ex))) return null;
    return {titulo:String(p.title||''), texto:ex.slice(0,700)};
  }catch(e){ return null; } finally{ clearTimeout(to); }
}
function sinRespuesta(t){ const c=chat();
  if(!esDueno()){ add('b','Todavía no sé responder eso 🤔 Prueba preguntándolo de otra forma.'); return; }
  c.pending=t; add('b','Todavía no sé responder eso 🤔\nEscribe tu respuesta para enseñarme (o "saltar").'); }
function wikiResponder(raw,t){
  add('b','🔎 No lo tengo guardado, lo busco en Wikipedia…');
  buscarWiki(raw).then(w=>{
    if(w){ ultimaWiki={q:t,a:w.texto}; add('b',w.texto+'\n\n📚 Fuente: Wikipedia — «'+w.titulo+'»'+(esDueno()?'\nSi quieres que lo recuerde sin internet, escribe /guardar.':'')); }
    else{ ultimaWiki=null; sinRespuesta(t); }
  });
}

// Theme
const themeBtn = $('theme');
const mqDark = matchMedia('(prefers-color-scheme: dark)');
function efectivo(t){ return (t==='dark'||t==='light') ? t : (mqDark.matches?'dark':'light'); }
function applyTheme(t){
  document.body.classList.remove('light','dark');
  if(t==='light') document.body.classList.add('light');
  else if(t==='dark') document.body.classList.add('dark');
  localStorage.setItem('atlas-theme', t||'auto');
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{ if(!m.dataset.o) m.dataset.o=m.content; m.content = t==='dark'?'#000000':t==='light'?'#ffffff':m.dataset.o; });
  themeBtn.textContent = efectivo(t)==='dark' ? '🌙' : '☀️';
  themeBtn.title = efectivo(t)==='dark' ? 'Modo oscuro (toca para claro)' : 'Modo claro (toca para oscuro)';
}
let curTheme = localStorage.getItem('atlas-theme') || 'auto';
applyTheme(curTheme);
themeBtn.onclick = ()=>{
  curTheme = efectivo(curTheme)==='dark' ? 'light' : 'dark';
  applyTheme(curTheme);
};
(mqDark.addEventListener?mqDark.addEventListener.bind(mqDark,'change'):mqDark.addListener.bind(mqDark))(()=>{ if(curTheme==='auto') applyTheme('auto'); });

// Typing indicator
function showTyping(){
  const d=document.createElement('div');
  d.className='typing';
  d.id='typing';
  d.innerHTML='<span></span><span></span><span></span>';
  $('msgs').appendChild(d);
  $('msgs').scrollTop=$('msgs').scrollHeight;
}
function hideTyping(){ const t=$('typing'); if(t) t.remove(); }

// Patch go with typing delay (keep original logic)
const originalGo = go;
go = function(){
  const raw = inp.value.trim();
  if(!raw) return;
  showTyping();
  // clear input immediately so it feels responsive
  const saved = raw;
  inp.value = '';
  inp.style.height = 'auto';
  setTimeout(()=>{
    hideTyping();
    // temporarily put value back so originalGo reads it, then clear again
    inp.value = saved;
    originalGo();
  }, 220 + Math.random()*180);
};
